<div class="auth-page">
  <div class="auth-card">

<div class ="login-container">
    <h2>SkillCypher</h2>
    <h3>Sign In</h3>

    @if (errorMessage) {
  <div class="error">{{errorMessage}}</div>
}
    <form (ngSubmit)="onLogin()">
        <input
            type = "email"
            placeholder="Email"
            [(ngModel)]="email"
            name="email"
            required
        />
        <input
            type ="password"
            placeholder="Password"
            [(ngModel)] = "password"
            name = "password"
            required
        />
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a routerLink="/register"> Register</a></p>
</div>
</div>
</div>
