<div class="auth-page">

  <div class="rive-container">
    <canvas
      #riveCanvas
      class="rive-background">
    </canvas>
  </div>

  <div class="auth-content">

    <div class="brand">
      <span class="brand-mark">SC</span>
      <span class="brand-name">SkillCypher</span>
    </div>

    <div class="auth-card">

      <div class="auth-header">
        <h1>Sign in</h1>
        <p>Continue to your SkillCypher workspace.</p>
      </div>

      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="onLogin()">

        <div class="form-group">
          <label for="email">Email</label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>

        <button
          type="submit"
          [disabled]="authState === 'loading'">

          @if (authState === 'loading') {
            Signing in...
          } @else {
            Sign in
          }

        </button>

      </form>

      <p class="register-prompt">
        Don't have an account?
        <a routerLink="/register">Create one</a>
      </p>

    </div>

  </div>

</div>
